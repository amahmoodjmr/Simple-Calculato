apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: project-tasks
spec:
  workspaces:
    - name: source
  steps:
    # 1. Cleanup task code snippet
    - name: cleanup
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        echo "Cleaning up workspace..."
        rm -rf *

    # 2. Test task code snippet (using nose)
    - name: nose-test
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        echo "Installing nose..."
        pip install nose
        echo "Running unit tests with nose..."
        nosetests
